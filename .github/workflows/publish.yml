name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the npm Trusted Publisher config.
    # Without this, the GitHub OIDC token carries no environment claim and npm
    # rejects the publish with a 404 on PUT.
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # OIDC trusted publishing needs: registry-url set (so npm targets npmjs.org
      # for the OIDC handshake) AND no auth token configured. setup-node@v4 forced
      # a placeholder NODE_AUTH_TOKEN that made npm use token auth and skip OIDC
      # (404); v6 stopped defaulting it (actions/setup-node#1440). So: v6 +
      # registry-url + NO NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm version (need >= 11.5 for trusted publishing)
        run: npm --version

      - name: Install dependencies
        run: bun install

      - name: Build bundle
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run bundle smoke test
        run: make smoke-bundle

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
