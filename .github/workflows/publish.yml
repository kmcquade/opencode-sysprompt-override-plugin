name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the npm Trusted Publisher config.
    # Without this, the GitHub OIDC token carries no environment claim and npm
    # rejects the publish with a 404 on PUT.
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Deliberately NO registry-url: it makes setup-node write an .npmrc with a
      # placeholder auth token (NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX). With any
      # token configured, npm uses token auth (garbage) and never attempts the
      # OIDC handshake -> "404 Not Found - PUT". OIDC trusted publishing requires
      # NO token at all; the default registry is npmjs.org, so we don't need it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify npm version (need >= 11.5 for trusted publishing)
        run: npm --version

      - name: Install dependencies
        run: bun install

      - name: Build bundle
        run: make build

      - name: Run unit tests
        run: make test

      - name: Run bundle smoke test
        run: make smoke-bundle

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
